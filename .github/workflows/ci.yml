name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}  # pour tester une branche : gh workflow run ci.yml --ref <branche>

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"
          # Par défaut, la clé du cache ne couvre que requirements.txt.
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Type check
        env:
          PYTHONPATH: src
        run: mypy src/autowebarchiver

      - name: Test
        env:
          PYTHONPATH: src
        run: pytest --cov=autowebarchiver --cov-report=term-missing
