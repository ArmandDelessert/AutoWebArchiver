version: 2
updates:
  # Actions utilisées par les workflows : une seule pull request groupée par mois.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  # pip : seulement les outils plafonnés avec ~= dans requirements-dev.txt, qui
  # n'avanceraient jamais seuls. Les dépendances en >= prennent déjà la dernière
  # version à chaque installation.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-name: "ruff"
      - dependency-name: "mypy"
    groups:
      outils-analyse:
        patterns:
          - "*"
